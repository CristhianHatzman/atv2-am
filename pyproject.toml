description = "AT2 - Classificação de churn com MLP e FastAPI"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pandas>=2.2,<3.0",
    "numpy>=2.0,<3.0",
    "scikit-learn>=1.5,<2.0",
    "matplotlib>=3.9,<4.0",
    "joblib>=1.4,<2.0",
    "jupyter>=1.1,<2.0",
    "nbconvert>=7.16,<8.0",
]

[tool.uv]
package = false
